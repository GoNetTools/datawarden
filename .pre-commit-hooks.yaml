# pre-commit (https://pre-commit.com) hooks. Only the literal-value
# detector runs at commit time; full tracing belongs in CI.
- id: datawarden
  name: datawarden (committed personal data)
  description: Blocks commits that add real personal data (VN phone numbers, CCCD, emails, card numbers, IBANs) to files.
  entry: datawarden scan --literals-only --no-cache
  language: golang
  types: [text]
  pass_filenames: true
  require_serial: true

- id: datawarden-docker
  name: datawarden (committed personal data, Docker)
  entry: ghcr.io/gonettools/datawarden:latest scan --literals-only --no-cache
  language: docker_image
  types: [text]
  pass_filenames: true
  require_serial: true

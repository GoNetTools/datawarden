#
# The built-in taxonomy: the classes of sensitive data datawarden knows and
# the data types in each. Adding a class or a data type is an edit here
# (see CONTRIBUTING, "Add a data type or class"); TestBuiltinTaxonomy
# checks the file.
#
# Class fields: id, label, description, severity (high raises the severity
# of every finding of the class).
# Data type fields: id, label, class, category (groups types in the data
# map), sensitive (special-category data, GDPR art. 9), severity,
# patterns (identifier words, space-separated tokens), weak (ambiguous
# abbreviations, lower confidence), exclude (tokens that rule the type out)
# values (regular expressions for committed values, see below) and
# rules_only (a type only source rules produce, with no patterns).

classes:
  - id: pii
    label: Personal data
    description: Information about an identified or identifiable person (GDPR, CCPA and similar laws).
  - id: phi
    label: Protected health information
    description: Health data linked to a person (HIPAA, GDPR art. 9).
    severity: high
  - id: pci
    label: Cardholder data
    description: Payment card numbers and card security data (PCI DSS).
    severity: high
  - id: credential
    label: Credentials and secrets
    description: Passwords, tokens and keys that grant access to systems or accounts.
    severity: high

data_types:
  - id: email
    label: Email address
    category: contact
    class: pii
    patterns: [email, e mail, email address, email addr, mail address]
    weak: [mail]
    exclude: [server, host, smtp, port, provider, domain]

  - id: phone
    label: Phone number
    category: contact
    class: pii
    patterns: [phone, phone number, phone no, phonenumber, mobile, mobile number, mobile no, msisdn, telephone, cellphone, cell phone]
    weak: [tel]
    exclude: [app, os, platform, frame, layout, screen, device, sdk, version, notch, portrait, landscape, web, tablet, redirect, uri, url, link, deeplink, scheme, client, build, view, menu, nav, navigation, breakpoint, style, theme, width, viewport, only, first]

  - id: person_name
    label: Person name
    category: identity
    class: pii
    patterns: [full name, fullname, first name, firstname, last name, lastname, given name, family name, surname, middle name, legal name, customer name, patient name, holder name, cardholder name, account holder]
    exclude: [file, class, type, host, field, column, table, package, module, app, bucket, method, func, function, event, screen, tag, attr, attribute, font, theme, bundle]

  - id: dob
    label: Date of birth
    category: identity
    class: pii
    patterns: [dob, date of birth, birth date, birthdate, birthday, birth day, year of birth, birth year]

  - id: address
    label: Postal address
    category: location
    class: pii
    patterns: [street address, home address, billing address, shipping address, postal address, mailing address, residential address, zip code, zipcode, postal code, postcode]
    weak: [address]
    exclude: [ip, ipv4, ipv6, mac, memory, wallet, server, remote, local, bind, listen, base, host, web, url, uri, socket, net, network, peer, proxy, gateway, contract, email, mail, ptr, pointer, offset, bluetooth, ble, hw, hardware, broadcast, multicast, sender, public, return, bar, book, resolver, dns, node, api, endpoint, virtual, physical]

  - id: ip_address
    label: IP address
    category: online
    class: pii
    patterns: [ip address, ipaddress, ip addr, ipaddr, client ip, remote ip, user ip, remote addr, remote address, x forwarded for, real ip]
    weak: [ip]
    exclude: [server, bind, listen, host, gateway, dns, proxy, subnet, cidr, range, allow, block, whitelist, allowlist]

  - id: national_id
    label: National ID number
    category: identity
    class: pii
    severity: high
    patterns: [national id, nationalid, citizen id, citizenid, identity number, identity card, id card, idcard, id number, nric, identification number, personal id, personal number, aadhaar]
    weak: [nid, nin]

  - id: us_ssn
    label: US Social Security number
    category: identity
    class: pii
    severity: high
    patterns: [ssn, social security, social security number, ss number]

  - id: passport
    label: Passport number
    category: identity
    class: pii
    severity: high
    patterns: [passport, passport number, passport no]

  - id: drivers_license
    label: Driver's license number
    category: identity
    class: pii
    severity: high
    patterns: [driver license, drivers license, driving license, driving licence, driver licence, license number]

  - id: tax_id
    label: Tax identification number
    category: identity
    class: pii
    severity: high
    patterns: [tax id, taxid, tax code, taxcode, tax number, tax identification]
    weak: [tin]

  - id: insurance_id
    label: Social/health insurance number
    category: identity
    class: pii
    severity: high
    patterns: [social insurance, health insurance number, insurance number, medicare number, nhs number]

  - id: credit_card
    label: Payment card number
    category: financial
    class: pci
    sensitive: true
    patterns: [card number, cardnumber, card no, credit card, creditcard, debit card, cc number, ccnumber, cc num, cvv, cvc, cvv2, card cvv, card expiry]
    weak: [pan]
    exclude: [type, brand, network, view, layout, icon, logo, scheme, last4, last, "4", bin, masked]

  - id: bank_account
    label: Bank account number
    category: financial
    class: pii
    sensitive: true
    patterns: [bank account, bankaccount, account number, accountnumber, account no, acct number, acct no, iban, routing number]

  - id: request_data
    label: Request data
    category: request
    class: pii
    # Data a client sent to a web handler, read as a whole or under a key
    # the source doesn't give (r.Body, req.body, request.POST,
    # @RequestBody). Often personal data, not always, so the source rules
    # that produce it have a moderate confidence. Read under a known key or
    # field name (form["email"], req.body.page), the name says what it is.
    rules_only: true

  - id: location
    label: Precise geolocation
    category: location
    class: pii
    sensitive: true
    patterns: [latitude, longitude, lat lng, latlng, lat long, geolocation, geo location, gps, coordinates, current location, user location, last location]
    weak: [lat, lng, lon, location]
    exclude: [file, url, path, dir, header, bucket, storage, code, source, line, column, offset, permission, service, manager, enabled, settings, request, provider, client]

  - id: device_id
    label: Device / advertising identifier
    category: device
    class: pii
    patterns: [imei, imsi, android id, androidid, device id, deviceid, idfa, idfv, gaid, advertising id, advertisingid, ad id, adid, udid, mac address, macaddress, hardware id, fcm token, push token, device token, registration token, serial number]
    exclude: [type, model, name, os, kind]

  - id: gender
    label: Gender
    category: demographic
    class: pii
    patterns: [gender]
    weak: [sex]

  - id: ethnicity
    label: Ethnicity / race
    category: demographic
    class: pii
    sensitive: true
    patterns: [ethnicity, ethnic, ethnic group]
    weak: [race]
    exclude: [condition, data, detector, check, trace]

  - id: religion
    label: Religion
    category: demographic
    class: pii
    sensitive: true
    patterns: [religion, religious]

  - id: health
    label: Health data
    category: health
    class: phi
    sensitive: true
    patterns: [diagnosis, medical record, medical history, health record, health condition, blood type, prescription, medication, allergy, allergies, disease, icd10]
    exclude: [code, service, api, check, endpoint]

  - id: biometric
    label: Biometric data
    category: biometric
    class: pii
    sensitive: true
    patterns: [biometric, biometrics, face template, face embedding, face vector, face id, faceprint, fingerprint template, fingerprint image, voiceprint, voice print, iris scan]

  - id: license_plate
    label: Vehicle license plate
    category: identity
    class: pii
    patterns: [license plate, licence plate, plate number, number plate]

  - id: medical_record_number
    label: Medical record number
    category: health
    class: phi
    sensitive: true
    patterns: [medical record number, medical record no, medical record id, mrn, patient number, health record number]

  # Credentials. Committed values are recognised by shape (values); a
  # value pattern needs keywords, substrings every match contains, which
  # are checked before the regex runs. Only the first capture group, if
  # any, is reported.

  - id: password
    label: Password
    category: secret
    class: credential
    patterns: [password, passwd, passphrase, pass phrase]
    weak: [pwd]
    exclude: [policy, strength, rule, rules, reset, forgot, forgotten, recovery, expiry, expiration, expires, age, complexity, requirement, requirements, visibility, visible, toggle, encoder, hasher, hint, length]

  - id: api_key
    label: API key
    category: secret
    class: credential
    patterns: [api key, x api key, access key, subscription key, api token]
    exclude: [header, name, env, var, variable, param, query, id]
    values:
      - name: aws-access-key-id
        regex: '\b((?:AKIA|ASIA)[0-9A-Z]{16})\b'
        keywords: [AKIA, ASIA]
        confidence: 0.95
        min_entropy: 3
      - name: stripe-secret-key
        regex: '\b((?:sk|rk)_live_[0-9A-Za-z]{20,99})\b'
        keywords: [sk_live_, rk_live_]
        confidence: 0.95
        min_entropy: 3
      - name: google-api-key
        regex: '\b(AIza[0-9A-Za-z_\-]{35})(?:[^0-9A-Za-z_\-]|$)'
        keywords: [AIza]
        confidence: 0.8
        min_entropy: 3.5
      - name: sendgrid-api-key
        regex: '\b(SG\.[0-9A-Za-z_\-]{22}\.[0-9A-Za-z_\-]{43})\b'
        keywords: [SG.]
        confidence: 0.95
        min_entropy: 4
      - name: anthropic-api-key
        regex: '\b(sk-ant-(?:api|admin)\d{2}-[0-9A-Za-z_\-]{80,120})'
        keywords: [sk-ant-]
        confidence: 0.95
        min_entropy: 4
      - name: openai-api-key
        regex: '\b(sk-(?:proj|svcacct|admin)-[0-9A-Za-z_\-]{40,200})'
        keywords: [sk-proj-, sk-svcacct-, sk-admin-]
        confidence: 0.9
        min_entropy: 4

  - id: access_token
    label: Access token
    category: secret
    class: credential
    patterns: [access token, auth token, authentication token, authorization token, bearer token, refresh token, id token, oauth token, personal access token]
    exclude: [header, name, env, type, expiry, expires, expiration, url, endpoint, lifetime, ttl, uri]
    values:
      - name: github-token
        regex: '\b((?:gh[pousr]_[0-9A-Za-z]{36,255}|github_pat_[0-9A-Za-z_]{82}))\b'
        keywords: [ghp_, gho_, ghu_, ghs_, ghr_, github_pat_]
        confidence: 0.95
        min_entropy: 3.5
      - name: gitlab-token
        regex: '\b(glpat-[0-9A-Za-z_\-]{20,})\b'
        keywords: [glpat-]
        confidence: 0.95
        min_entropy: 3.5
      - name: slack-token
        regex: '\b(xox[abprs]-[0-9A-Za-z\-]{10,72})\b'
        keywords: [xoxa-, xoxb-, xoxp-, xoxr-, xoxs-]
        confidence: 0.9
        min_entropy: 3
      - name: jwt
        regex: '\b(eyJ[0-9A-Za-z_\-]{10,}\.eyJ[0-9A-Za-z_\-]{10,}\.[0-9A-Za-z_\-]{20,})'
        keywords: [eyJ]
        confidence: 0.8
        min_entropy: 4

  - id: secret_key
    label: Secret key
    category: secret
    class: credential
    patterns: [secret key, client secret, secret access key, signing key, signing secret, app secret, api secret, webhook secret, jwt secret, shared secret, master key, encryption key, hmac key, hmac secret]
    weak: [secret]
    exclude: [name, arn, ref, path, env, file, filename, version, manager, header, id]

  - id: private_key
    label: Private key
    category: secret
    class: credential
    patterns: [private key, priv key, privkey]
    exclude: [path, file, filename, id, env, name, alias]
    values:
      - name: private-key-block
        regex: '(-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----)'
        keywords: [PRIVATE KEY]
        confidence: 0.9

  - id: session_token
    label: Session token
    category: secret
    class: credential
    patterns: [session token, session id, session cookie, session key, session secret, sessionid]
    exclude: [timeout, ttl, expiry, expires, name, duration, length, header, store, storage, manager]

# API models: what library calls do with the data they are given, and
# what they return. Sinks say where data leaves the program; these say
# how it moves inside it, so the engine does not have to guess from a
# method's name.
#
#   effect: builder   the arguments go into the receiver, which is returned (StringBuilder.append, Request.Builder.post)
#   effect: sends     the arguments leave the program; the result is the remote's answer (HttpClient.send)
#   effect: derives   the result carries every argument (String.format)
#   effect: none      the result carries no data (String.length, List.size)
#   returns: T        the qualified type the call returns; "$T" is the receiver's element type (Optional<User>.get())
#
# A call no rule describes is handled by name: put/add/append/with...
# are builders, post/fetch/request send, size/isEmpty/equals carry
# nothing, and anything else derives.


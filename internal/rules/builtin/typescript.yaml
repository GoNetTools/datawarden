- id: sdk.ts.fullstory
  lang: typescript
  call: ["FS.identify", "FS.setUserVars", "FS.event", "FS", "@fullstory/browser.FullStory", "@fullstory/browser.identify", "@fullstory/browser.setUserVars",
         "@fullstory/browser.event", "@fullstory/react-native.identify", "@fullstory/react-native.setUserVars", "@fullstory/react-native.event"]
  arg: "*"
  dest: { host: fullstory.com, kind: third_party, vendor: FullStory }
  category: monitoring

- id: sdk.ts.hotjar
  lang: typescript
  call: ["hj", "@hotjar/browser.identify", "@hotjar/browser.event", "@hotjar/browser.Hotjar.identify", "react-hotjar.hotjar.identify", "react-hotjar.hotjar.event"]
  arg: "*"
  dest: { host: hotjar.com, kind: third_party, vendor: Hotjar }
  category: monitoring

- id: sdk.ts.gtag
  lang: typescript
  call: ["gtag"]
  arg: [1, 2]
  dest: { host: google-analytics.com, kind: third_party, vendor: Google Analytics }
  category: analytics

- id: sdk.ts.meta_pixel
  lang: typescript
  call: ["fbq"]
  arg: [1, 2]
  dest: { host: facebook.com, kind: third_party, vendor: Meta }
  category: advertising

- id: sdk.ts.intercom
  lang: typescript
  call: ["Intercom", "@intercom/messenger-js-sdk.*", "@intercom/intercom-react-native.*"]
  arg: "*"
  dest: { host: intercom.io, kind: third_party, vendor: Intercom }
  category: support

- id: storage.ts.web_storage
  lang: typescript
  call: ["localStorage.setItem", "sessionStorage.setItem"]
  arg: 1
  dest: { kind: storage, host: browser-storage }
  category: storage
  description: Web Storage is readable by any script on the origin (XSS) and is never encrypted.

- id: storage.ts.async_storage
  lang: typescript
  call: ["@react-native-async-storage/async-storage.setItem", "@react-native-async-storage/async-storage.mergeItem", "@react-native-async-storage/async-storage.multiSet"]
  receiver: "(?i)asyncstorage"
  arg: "*"
  dest: { kind: storage, host: async-storage }
  category: storage
  description: AsyncStorage is unencrypted on device.

- id: net.ts.fetch
  lang: typescript
  call: ["fetch"]
  arg: [0, 1]
  host_arg: 0
  dest: { kind: network }
  category: network

- id: net.ts.axios
  lang: typescript
  call: ["axios", "axios.post", "axios.put", "axios.patch", "axios.get", "axios.delete", "axios.request", "axios.AxiosInstance.*"]
  receiver: "(?i)^(this\\.)?_?(http|api|client|axios\\w*)$"
  arg: "*"
  host_arg: 0
  dest: { kind: network }
  category: network

- id: net.ts.beacon
  lang: typescript
  call: ["navigator.sendBeacon"]
  arg: 1
  host_arg: 0
  dest: { kind: network }
  category: network

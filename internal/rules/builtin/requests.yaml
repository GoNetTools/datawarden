# Source rules for what a client sends to a web handler: request bodies,
# forms and bound request objects. Request data is personal data often, not
# always, so these rules have a moderate confidence. A value read under a
# constant key or field name (form["email"], req.body.page,
# getParameter("q")) is described by that name instead, so only data read
# as a whole, or under a key the code computes, is request_data.


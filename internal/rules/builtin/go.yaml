# Built-in sink rules for Go. Callee names are "importpath.Func" or
# "importpath.Type.Method" (pointer receivers and type parameters dropped).
# `arg` counts from 0 and excludes the receiver; "*" means every argument.

- id: log.go.stdlib
  lang: go
  call: ["log.Print*", "log.Fatal*", "log.Panic*", "log.Logger.Print*", "log.Logger.Fatal*", "log.Logger.Panic*", "log.Logger.Output"]
  arg: "*"
  dest: { kind: log, host: stderr }
  category: logging

- id: log.go.fmt_print
  lang: go
  call: ["fmt.Print", "fmt.Printf", "fmt.Println"]
  arg: "*"
  dest: { kind: log, host: stdout }
  category: logging

- id: log.go.slog
  lang: go
  call: ["log/slog.Info*", "log/slog.Debug*", "log/slog.Warn*", "log/slog.Error*", "log/slog.Log*", "log/slog.Logger.*"]
  arg: "*"
  dest: { kind: log, host: slog }
  category: logging

- id: log.go.zap
  lang: go
  call: ["go.uber.org/zap.Logger.*", "go.uber.org/zap.SugaredLogger.*"]
  arg: "*"
  dest: { kind: log, host: zap }
  category: logging

- id: log.go.logrus
  lang: go
  call: ["github.com/sirupsen/logrus.Info*", "github.com/sirupsen/logrus.Debug*", "github.com/sirupsen/logrus.Warn*",
         "github.com/sirupsen/logrus.Error*", "github.com/sirupsen/logrus.Print*", "github.com/sirupsen/logrus.With*",
         "github.com/sirupsen/logrus.Entry.*", "github.com/sirupsen/logrus.Logger.*", "github.com/sirupsen/logrus.FieldLogger.*"]
  arg: "*"
  dest: { kind: log, host: logrus }
  category: logging

- id: log.go.zerolog
  lang: go
  call: ["github.com/rs/zerolog.Event.*", "github.com/rs/zerolog.Context.*", "github.com/rs/zerolog/log.Print*"]
  arg: "*"
  dest: { kind: log, host: zerolog }
  category: logging

- id: sdk.go.sentry.scope
  lang: go
  call: ["github.com/getsentry/sentry-go.Scope.SetUser", "github.com/getsentry/sentry-go.Scope.SetExtras", "github.com/getsentry/sentry-go.Scope.SetTags",
         "github.com/getsentry/sentry-go.Scope.AddBreadcrumb", "github.com/getsentry/sentry-go.AddBreadcrumb",
         "github.com/getsentry/sentry-go.CaptureMessage", "github.com/getsentry/sentry-go.CaptureException", "github.com/getsentry/sentry-go.CaptureEvent",
         "github.com/getsentry/sentry-go.Hub.CaptureMessage", "github.com/getsentry/sentry-go.Hub.CaptureException", "github.com/getsentry/sentry-go.Hub.CaptureEvent"]
  arg: 0
  dest: { kind: third_party, host: sentry.io, vendor: Sentry }
  category: crash_reporting

- id: sdk.go.sentry.scope_kv
  lang: go
  call: ["github.com/getsentry/sentry-go.Scope.SetExtra", "github.com/getsentry/sentry-go.Scope.SetTag", "github.com/getsentry/sentry-go.Scope.SetContext"]
  arg: 1
  dest: { kind: third_party, host: sentry.io, vendor: Sentry }
  category: crash_reporting

- id: sdk.go.otel
  lang: go
  call: ["go.opentelemetry.io/otel/trace.Span.SetAttributes", "go.opentelemetry.io/otel/trace.Span.AddEvent", "go.opentelemetry.io/otel/trace.Span.RecordError",
         "go.opentelemetry.io/otel/trace.Span.SetStatus", "go.opentelemetry.io/otel/baggage.NewMember", "go.opentelemetry.io/otel/baggage.NewKeyValueProperty",
         "go.opentelemetry.io/otel/log.Record.SetBody", "go.opentelemetry.io/otel/log.Record.AddAttributes"]
  arg: "*"
  dest: { kind: third_party, host: otel-collector, vendor: OpenTelemetry collector }
  category: tracing
  description: Span attributes, events and statuses, baggage (propagated to every downstream service in request headers) and log records are exported to the tracing backend. A collector you run yourself can be declared first party in first_party_domains.

- id: sdk.go.datadog.trace
  lang: go
  call: ["gopkg.in/DataDog/dd-trace-go.v1/ddtrace.Span.SetTag", "gopkg.in/DataDog/dd-trace-go.v1/ddtrace/tracer.SetUser",
         "gopkg.in/DataDog/dd-trace-go.v1/ddtrace/tracer.StartSpan", "gopkg.in/DataDog/dd-trace-go.v1/ddtrace/tracer.StartSpanFromContext",
         "github.com/DataDog/dd-trace-go/v2/ddtrace/tracer.Span.SetTag", "github.com/DataDog/dd-trace-go/v2/ddtrace/tracer.SetUser",
         "github.com/DataDog/dd-trace-go/v2/ddtrace/tracer.StartSpan", "github.com/DataDog/dd-trace-go/v2/ddtrace/tracer.StartSpanFromContext"]
  arg: "*"
  dest: { kind: third_party, host: datadoghq.com, vendor: Datadog }
  category: tracing
  description: Span tags (SetTag, tracer.Tag options) and the user set with tracer.SetUser are sent to Datadog APM.

- id: sdk.go.newrelic
  lang: go
  call: ["github.com/newrelic/go-agent/v3/newrelic.Transaction.AddAttribute", "github.com/newrelic/go-agent/v3/newrelic.Transaction.SetUserID",
         "github.com/newrelic/go-agent/v3/newrelic.Segment.AddAttribute", "github.com/newrelic/go-agent/v3/newrelic.Application.RecordCustomEvent",
         "github.com/newrelic/go-agent/v3/newrelic.Application.RecordLog", "github.com/newrelic/go-agent/v3/newrelic.Transaction.RecordLog"]
  arg: "*"
  dest: { kind: third_party, host: collector.newrelic.com, vendor: New Relic }
  category: tracing

- id: sdk.go.honeycomb
  lang: go
  call: ["github.com/honeycombio/libhoney-go.Event.AddField", "github.com/honeycombio/libhoney-go.Event.Add", "github.com/honeycombio/libhoney-go.Builder.AddField",
         "github.com/honeycombio/beeline-go.AddField", "github.com/honeycombio/beeline-go.AddFieldToTrace", "github.com/honeycombio/beeline-go/trace.Span.AddField"]
  arg: "*"
  dest: { kind: third_party, host: api.honeycomb.io, vendor: Honeycomb }
  category: tracing


- id: sdk.py.otel
  lang: python
  call: ["opentelemetry.trace.get_current_span().set_attribute", "opentelemetry.trace.get_current_span().set_attributes",
         "opentelemetry.trace.get_current_span().add_event", "opentelemetry.trace.get_current_span().record_exception",
         "opentelemetry.trace.Span.set_attribute", "opentelemetry.trace.Span.set_attributes", "opentelemetry.trace.Span.add_event",
         "opentelemetry.trace.Span.record_exception", "opentelemetry.baggage.set_baggage"]
  receiver: "(?i)^(self\\.)?_?(current_|root_|parent_|child_)?span$"
  arg: "*"
  dest: { kind: third_party, host: otel-collector, vendor: OpenTelemetry collector }
  category: tracing
  description: Span attributes and events, and baggage (propagated to downstream services), are exported to the tracing backend. Logs bridged from the logging module are covered by log.py.logging.


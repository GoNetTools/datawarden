# Built-in rules for Kotlin and Java (Android and server side).

- id: log.android.logcat
  lang: [kotlin, java]
  call: ["android.util.Log.v", "android.util.Log.d", "android.util.Log.i", "android.util.Log.w", "android.util.Log.e", "android.util.Log.wtf", "android.util.Log.println"]
  arg: "*"
  dest: { kind: log, host: logcat }
  category: logging
  description: Logcat is readable via adb and ends up in bug reports.

- id: log.android.timber
  lang: [kotlin, java]
  call: ["timber.log.Timber.v", "timber.log.Timber.d", "timber.log.Timber.i", "timber.log.Timber.w", "timber.log.Timber.e", "timber.log.Timber.wtf", "timber.log.Timber.log", "timber.log.Timber.Tree.*"]
  arg: "*"
  dest: { kind: log, host: logcat }
  category: logging


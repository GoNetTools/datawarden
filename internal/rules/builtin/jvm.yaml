- id: log.jvm.logger
  lang: [kotlin, java]
  call: ["org.slf4j.Logger.trace", "org.slf4j.Logger.debug", "org.slf4j.Logger.info", "org.slf4j.Logger.warn", "org.slf4j.Logger.error",
         "java.util.logging.Logger.info", "java.util.logging.Logger.warning", "java.util.logging.Logger.severe", "java.util.logging.Logger.fine", "java.util.logging.Logger.log",
         "org.apache.logging.log4j.Logger.info", "org.apache.logging.log4j.Logger.debug", "org.apache.logging.log4j.Logger.warn", "org.apache.logging.log4j.Logger.error",
         "mu.KLogger.info", "mu.KLogger.debug", "mu.KLogger.warn", "mu.KLogger.error", "mu.KLogger.trace"]
  receiver: "(?i)^(this\\.)?_?(log|logger)$"
  arg: "*"
  dest: { kind: log, host: application-log }
  category: logging


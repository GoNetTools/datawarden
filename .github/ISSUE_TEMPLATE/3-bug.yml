name: Bug
description: A crash, wrong exit code, broken report, CI integration problem or other bug.
labels: ["bug", "triage"]
body:
  - type: input
    id: version
    attributes:
      label: datawarden version
      description: Output of `datawarden version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run datawarden?
      options: [Release binary, Docker image, go install, GitHub Action, pre-commit, Built from source]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 amd64, macOS 15 arm64, Windows 11 amd64, …
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and its output. Add `--verbose` for progress logs.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: This report contains no real personal data.
          required: true

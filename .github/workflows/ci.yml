name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, to catch newly published vulnerabilities
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local # use exactly the Go that setup-go installed
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.1
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.8.0
  ACTIONLINT: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: License headers
        run: bash scripts/check-headers.sh
      - name: go vet
        run: |
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=0 go vet ./...
      - name: staticcheck
        run: |
          CGO_ENABLED=1 go run "$STATICCHECK" ./...
          CGO_ENABLED=0 go run "$STATICCHECK" ./...
      - name: actionlint
        run: go run "$ACTIONLINT"

  vulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: go run "$GOVULNCHECK" ./...

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: [stable]
        include:
          - os: ubuntu-24.04
            go: oldstable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: C compiler for cgo (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v gcc >/dev/null 2>&1; then
            choco install mingw --no-progress -y
            echo 'C:\ProgramData\mingw64\mingw64\bin' >> "$GITHUB_PATH"
          fi
      - name: Test with cgo (all frontends)
        if: runner.os != 'Linux' || matrix.go != 'stable'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test ./...
      - name: Test with cgo, race detector and coverage
        if: runner.os == 'Linux' && matrix.go == 'stable'
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
          echo "Coverage: $(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test without cgo (Go frontend + literal detector)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  # piiflow scans itself: the fixtures must fail, the project must be clean.
  scan-self:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # SARIF upload on pushes to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # --diff needs the merge base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build
        run: |
          bash scripts/release/build.sh "ci-${GITHUB_SHA::12}" "$RUNNER_TEMP/bin"
          echo "PIIFLOW=$RUNNER_TEMP/bin/linux_amd64/piiflow" >> "$GITHUB_ENV"
      - name: Fixtures report their planted leaks (exit 1)
        run: |
          "$PIIFLOW" version
          for fixture in goapp android web; do
            code=0
            "$PIIFLOW" scan "testdata/$fixture" --root "testdata/$fixture" --no-baseline --no-cache > /dev/null || code=$?
            if [ "$code" -ne 1 ]; then
              echo "::error::testdata/$fixture: exit code $code, want 1"
              exit 1
            fi
          done
      - name: Scan this repository
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(scan . --sarif piiflow.sarif --markdown piiflow.md)
          if [ -n "$BASE_REF" ]; then args+=(--diff "origin/$BASE_REF"); fi
          code=0
          "$PIIFLOW" "${args[@]}" || code=$?
          cat piiflow.md >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Upload SARIF to code scanning
        if: always() && github.event_name == 'push' && hashFiles('piiflow.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: piiflow.sarif
          category: piiflow

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both platforms (cross-compiled, no emulation)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: piiflow:ci
          build-args: VERSION=ci
          cache-from: type=gha
      - name: Smoke test the image
        run: |
          docker run --rm piiflow:ci version
          code=0
          docker run --rm -v "$PWD/testdata/web:/src" piiflow:ci scan . --no-baseline --no-cache > /dev/null || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::image scan of testdata/web: exit code $code, want 1"
            exit 1
          fi
